name: Validate Aufbrauchen

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: aufbrauchen-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  web:
    name: Aufbrauchen web workflows and source handoff
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: projects/Aufbrauchen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/Aufbrauchen/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Shared data scenarios, backup validation and exact PWA/source archive
        run: |
          npm test
          node --check web/app.js
          python3 scripts/package.py --check
      - name: Install real browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Real workflows, files, parallel windows and offline app
        run: npm run test:browser

  android:
    name: Aufbrauchen Android build and emulator tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: projects/Aufbrauchen/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Install verified Android tools
        run: |
          task_sdk_root="$RUNNER_TEMP/aufbrauchen-sdk"
          task_sdk_unpack="$RUNNER_TEMP/aufbrauchen-cli"
          mkdir -p "$task_sdk_root/cmdline-tools" "$task_sdk_unpack"
          curl --fail --silent --show-error --location --retry 2 https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip -o "$RUNNER_TEMP/aufbrauchen-cli.zip"
          printf '%s  %s\n' e025545c62a8e64c7559119566a569fb1dec5f60 "$RUNNER_TEMP/aufbrauchen-cli.zip" | sha1sum --check --strict
          unzip -q "$RUNNER_TEMP/aufbrauchen-cli.zip" -d "$task_sdk_unpack"
          mv "$task_sdk_unpack/cmdline-tools" "$task_sdk_root/cmdline-tools/latest"
          echo "ANDROID_HOME=$task_sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$task_sdk_root" >> "$GITHUB_ENV"
          echo "$task_sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$task_sdk_root/platform-tools" >> "$GITHUB_PATH"
          echo "$task_sdk_root/emulator" >> "$GITHUB_PATH"
      - name: Install pinned build and emulator packages
        run: |
          android sdk install 'platform-tools@37.0.1'
          android sdk install 'platforms/android-36@2.0.0'
          android sdk install 'build-tools/36.0.0@36.0.0'
          android sdk install 'emulator@37.2.13'
          android sdk install 'system-images/android-30/default/x86_64@11.0.0'
          android sdk install 'platforms/android-30@3.0.0'
      - name: Android unit tests, lint, debug and signed release
        run: ./gradlew --no-daemon --max-workers=2 testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Verify the actual release package
        run: python3 ../scripts/verify-apk.py app/build/outputs/apk/release/app-release.apk
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Native UI, persistence and atomic storage tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_2
          disk-size: 2048M
          working-directory: projects/Aufbrauchen/android
          emulator-options: -no-window -gpu swiftshader -no-snapshot -no-audio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: ./gradlew --no-daemon --max-workers=2 connectedDebugAndroidTest
      - name: Require actual passing tests without skips
        run: python3 ../scripts/check-test-results.py
