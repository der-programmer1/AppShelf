name: Factory League
on:
  push:
    branches: [main]
    paths: ["projects/Factory-League/**", ".github/workflows/factory-league.yml"]
  pull_request:
    paths: ["projects/Factory-League/**", ".github/workflows/factory-league.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: factory-league-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/Factory-League
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/Factory-League/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: factory-league-test-results
          path: projects/Factory-League/test-results/
          retention-days: 7
