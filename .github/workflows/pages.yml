name: Build and publish AppShelf

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Pages build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install build dependencies
        run: npm ci --ignore-scripts
      - name: Validate project manifests and build
        run: npm test
      - name: Build Pages output before merging
        if: github.event_name == 'pull_request'
        env:
          CI: "true"
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run build

  releases:
    name: Publish app files
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.APPSHELF_GITHUB_PAGES_ENABLED == 'true'
    permissions:
      contents: write
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether app files changed
        id: release-changes
        env:
          RELEASE_BASE_SHA: ${{ github.event.before }}
        run: |
          if [[ -n "$RELEASE_BASE_SHA" ]] &&
             git cat-file -e "${RELEASE_BASE_SHA}^{commit}" 2>/dev/null &&
             git diff --quiet "$RELEASE_BASE_SHA" HEAD -- apps/inbox scripts/publish-releases.mjs; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Node
        if: steps.release-changes.outputs.needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create or update app releases
        if: steps.release-changes.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-releases.mjs

  pages:
    name: Build GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.APPSHELF_GITHUB_PAGES_ENABLED == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    needs: [validate, releases]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install build dependencies
        run: npm ci --ignore-scripts
      - name: Build catalogue
        env:
          CI: "true"
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/build-catalog.mjs --out dist
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
