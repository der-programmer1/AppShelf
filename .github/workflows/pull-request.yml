name: Validate AppShelf pull request

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: appshelf-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  catalogue:
    name: Catalogue tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Validate manifests, archives and generated pages
        run: npm test
      - name: Build catalogue without publishing
        env:
          CI: "true"
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run build

  news-browser:
    name: AppShelf news browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build the real project-site layout
        env:
          CI: "true"
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run build
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Navigation, phone layout, keyboard and static history
        run: npm run test:browser
      - name: Real app workflows, persistence, media and offline mode in Chromium and WebKit
        run: npm run test:web:browser

  leistenplan:
    name: LeistenPlan Android tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: projects/LeistenPlan
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Install checksum-verified Android command line tools
        run: |
          task_sdk_root="$RUNNER_TEMP/appshelf-sdk"
          task_sdk_unpack="$RUNNER_TEMP/appshelf-cli-unpack"
          mkdir -p "$task_sdk_root/cmdline-tools" "$task_sdk_unpack"
          curl --fail --silent --show-error --location --retry 2 https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip -o "$RUNNER_TEMP/appshelf-android-cli.zip"
          printf '%s  %s\n' e025545c62a8e64c7559119566a569fb1dec5f60 "$RUNNER_TEMP/appshelf-android-cli.zip" | sha1sum --check --strict
          unzip -q "$RUNNER_TEMP/appshelf-android-cli.zip" -d "$task_sdk_unpack"
          mv "$task_sdk_unpack/cmdline-tools" "$task_sdk_root/cmdline-tools/latest"
          echo "ANDROID_HOME=$task_sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$task_sdk_root" >> "$GITHUB_ENV"
          echo "$task_sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$task_sdk_root/platform-tools" >> "$GITHUB_PATH"
          echo "$task_sdk_root/emulator" >> "$GITHUB_PATH"
      - name: Install pinned platform and build tools
        run: |
          android sdk install 'platform-tools@37.0.1'
          android sdk install 'platforms/android-36@2.0.0'
          android sdk install 'build-tools/36.0.0@36.0.0'
          android sdk install 'emulator@37.2.13'
          android sdk install 'system-images/android-30/default/x86_64@11.0.0'
      - name: Unit tests, lint and build
        run: ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Enable hardware acceleration on the ephemeral runner
        run: sudo chmod 666 /dev/kvm
      - name: Android core flow, recreation and reset tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_2
          working-directory: projects/LeistenPlan
          emulator-options: -no-window -gpu swiftshader -no-snapshot -no-audio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: ./gradlew --no-daemon --max-workers=2 :app:connectedDebugAndroidTest
      - name: Verify complete source handoff
        # The user removed this app from the catalogue; keep testing its retained source,
        # but do not require or restore an intentionally removed download archive.
        if: hashFiles('apps/inbox/leistenplan/app.json') != ''
        run: python3 scripts/package.py --check
