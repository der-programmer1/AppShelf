<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f1e8" data-light="#f4f1e8" data-dark="#101410">
    <meta name="description" content="Persönliches Archiv für eigene Android-Apps, Web-Tools und Software-Projekte.">
    <title>AppShelf — Digitaler Werkstatt-Schrank</title>
    <link rel="icon" href="assets/logo-mark.svg" type="image/svg+xml">
    <script src="assets/theme.js"></script>
    <link rel="stylesheet" href="assets/style.css">
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="AppShelf Startseite">
          <span class="brand-mark" aria-hidden="true">✦</span>
          <span>App<span class="brand-accent">Shelf</span></span>
        </a>
        <select class="theme-select" data-theme-select aria-label="Farbschema" hidden>
          <option value="system">System</option>
          <option value="light">Hell</option>
          <option value="dark">Dunkel</option>
        </select>
      </header>
      <main>
        <section class="hero" aria-labelledby="hero-title">
          <div>
            <p class="eyebrow">Dein digitaler Werkstatt-Schrank</p>
            <h1 id="hero-title">Viele Ideen.<br><em>Ein klarer Ort.</em></h1>
            <p class="hero-lede">AppShelf ist mein persönliches Archiv für eigene Android-Apps, Web-Tools und Software-Projekte. Hier kannst du sie ausprobieren und herunterladen.</p>
            <a class="button primary hero-action" href="#catalog-title">Apps entdecken</a>
          </div>
          <div class="hero-orbit" aria-hidden="true">
            <span class="orbit-line orbit-line-one"></span>
            <span class="orbit-line orbit-line-two"></span>
            <span class="orbit-card orbit-card-main">APK<br><strong>bereit</strong></span>
            <span class="orbit-card orbit-card-small">01<br><strong>Idee</strong></span>
          </div>
        </section>
        <section class="catalog-section" aria-labelledby="catalog-title">
          <p class="eyebrow">Die Sammlung</p>
          <h2 id="catalog-title" tabindex="-1">Alle Projekte</h2>
          <div class="app-grid">
            <!-- PROJECT_CARDS -->
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
